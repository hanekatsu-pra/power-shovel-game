<!doctype html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>キャラクター紐付け一覧</title><style>body{margin:0;background:#fffaf0;color:#263238;font-family:system-ui,sans-serif}main{max-width:1280px;margin:auto;padding:28px}.note{color:#59656a}#grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}article{background:#fff;border:2px solid #e8d6b9;border-radius:14px;padding:12px;box-shadow:0 3px 12px #6f4e3720}h2{font-size:16px;margin:0 0 8px}.pose{height:235px;background:#f7f4ec;display:grid;place-items:end center;border-radius:9px;overflow:hidden}img{max-width:100%;max-height:100%;object-fit:contain}.meta{font-size:12px;line-height:1.5;margin:9px 0 0}.pending{color:#9a6700}</style></head><body><main><h1>キャラクター紐付け一覧</h1><p class="note">観戦用（正面）の確認一覧です。歩行用は各プロフィールごとに「正面・右・左・後ろ」の4方向セットとして管理します。旧 spectator_man_01 は spectator_11 に統合済みです。</p><section id="grid"></section><script>const profiles=[['spectator_01','イエローカーディガンの来場者','spectator-01-handdrawn.png'],['spectator_02','白いジャケットの来場者','spectator-02-front-handdrawn.png'],['spectator_03','子どもの来場者 01','spectator-03-handdrawn.png'],['spectator_04','子どもの来場者 02','spectator-04-handdrawn.png'],['spectator_05','来場者 05','spectator-05-handdrawn.png'],['spectator_06','来場者 06','spectator-06-handdrawn.png'],['spectator_07','来場者 07','spectator-07-handdrawn.png'],['spectator_08','来場者 08','spectator-08-handdrawn.png'],['spectator_09','来場者 09','spectator-09-handdrawn.png'],['spectator_10','来場者 10','spectator-10-handdrawn.png'],['spectator_11','男性来場者 01（旧 spectator_man_01）','spectator-11-handdrawn.png']];document.querySelector('#grid').innerHTML=profiles.map(([id,name,file])=>'<article><h2>'+id+'</h2><div class="pose"><img src="./images/'+file+'" alt="'+name+'"></div><p class="meta">'+name+'<br>観戦: 正面<br><span class="pending">歩行: 正面・右・左・後ろ（同一IDへ紐付け）</span></p></article>').join('')</script></main></body></html>
